<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Lista de Tarefas</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md">

        <!-- Logo / Título -->
        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-white">
                Lista de
                <span class="text-blue-500">
                    Tarefas
                </span>
            </h1>

            <p class="text-gray-400 mt-2">
                Entre para organizar suas tarefas
            </p>

        </div>


        <!-- Card -->
        <section class="bg-gray-900 border border-gray-800 rounded-2xl shadow-xl p-8">

            <h2 class="text-2xl font-bold text-white mb-6">
                Entrar
            </h2>


            <form>

                <!-- Email -->
                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        E-mail
                    </label>

                    <input
                        type="email"
                        placeholder="seuemail@email.com"
                        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >

                </div>


                <!-- Senha -->
                <div class="mb-6">

                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        Senha
                    </label>

                    <input
                        type="password"
                        placeholder="Digite sua senha"
                        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >

                </div>


                <!-- Botão -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-300"
                >
                    Entrar
                </button>

            </form>


            <!-- Registro -->
            <div class="text-center mt-6">

                <p class="text-gray-400">

                    Ainda não possui uma conta?

                    <a
                        href="registre.html"
                        class="text-blue-500 hover:text-blue-400 font-medium"
                    >
                        Criar conta
                    </a>

                </p>

            </div>

        </section>

    </main>

</body>
</html>
