<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Lista de Tarefas</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</head>


<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">


    <main class="w-full max-w-md">


        <!-- Título -->

        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-white">

                Criar
                <span class="text-blue-500">
                    Conta
                </span>

            </h1>


            <p class="text-gray-400 mt-2">

                Comece a organizar suas tarefas

            </p>

        </div>



        <!-- Card -->

        <section class="bg-gray-900 border border-gray-800 rounded-2xl shadow-xl p-8">


            <form id="formRegistro">


                <!-- Nome -->

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        Nome
                    </label>


                    <input id="nome" type="text" placeholder="Digite seu nome"
                        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        required>

                </div>



                <!-- Email -->

                <div class="mb-5">

                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        E-mail
                    </label>


                    <input id="email" type="email" placeholder="seuemail@email.com"
                        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        required>

                </div>



                <!-- Senha -->

                <div class="mb-6">

                    <label class="block text-sm font-medium text-gray-300 mb-2">
                        Senha
                    </label>


                    <input id="senha" type="password" placeholder="Crie uma senha"
                        class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                      
                    >

                </div>



                !-- Botão

                <button
                    type=" submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-300">

                    Criar conta

                    </button>


            </form>



            <!-- Login -->

            <div class="text-center mt-6">

                <p class="text-gray-400">

                    Já possui uma conta?


                    <a href="login.html" class="text-blue-500 hover:text-blue-400 font-medium">

                        Fazer login

                    </a>

                </p>

            </div>


        </section>


    </main>


</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const formRegistro = document.getElementById("formRegistro");

formRegistro.addEventListener("submit", async function(event) {

    event.preventDefault();

    const nome = document.getElementById("nome").value;

    const email = document.getElementById("email").value;

    const senha = document.getElementById("senha").value;


    const { data, error } = await supabaseClient.auth.signUp({

        email: email,

        password: senha,

        options: {
            data: {
                nome: nome
            }
        }

    });


    if (error) {

        alert("Erro: " + error.message);

        return;

    }


    alert("Conta criada com sucesso!");

    window.location.href = "login.html";

});

</script>
